<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>いいね・登録アニメ素材</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

  :root{
    --bg: #000000;
    --accent: #F4423A;
    --text: #F4F1EA;
    --text-dim: #F4F1EA80;
    --panel: #14151ACC;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    min-height:100vh; overflow-y:auto; overflow-x:hidden;
    padding: 24px 0;
    transition: background 0.4s ease;
    -webkit-tap-highlight-color: transparent;
  }
  body.record-mode{ justify-content:center; }
  body.bg-black{ --bg:#000000; }
  body.bg-white{ --bg:#FFFFFF; --text:#0B0C10; --text-dim:#0B0C1080; --panel:#FFFFFFCC; }
  body.bg-green{ --bg:#00FF00; --text:#050505; --text-dim:#05050580; --panel:#FFFFFFCC; }

  .stage{
    position:relative;
    width:min(70vmin, 460px);
    height:min(70vmin, 460px);
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- LIKE ---------- */
  #likeStage{ display:flex; flex-direction:column; align-items:center; }
  .like-container{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:18px;
    padding: 30px 40px;
    border-radius: 26px;
    transition: background-color 0.2s ease;
  }
  .like-container.framed{ overflow:hidden; }
  .icon-row{ display:flex; align-items:center; justify-content:center; gap:22px; }
  .icon-wrap{ position:relative; width:34vmin; max-width:190px; aspect-ratio:1; display:flex; align-items:center; justify-content:center; }
  .icon-svg{ width:100%; height:100%; overflow:visible; }
  .icon-path{
    fill:none;
    stroke:var(--text);
    stroke-width:5;
    stroke-linejoin:round;
    stroke-linecap:round;
    transition: fill 0.25s ease 0.05s, stroke 0.25s ease;
  }
  .icon-wrap.filled .icon-path{ fill:var(--accent); stroke:var(--accent); }
  .icon-wrap.bump .icon-svg{ animation: bump 0.55s cubic-bezier(.22,1.6,.4,1); }
  @keyframes bump{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.32); }
    60%{ transform:scale(0.92); }
    100%{ transform:scale(1); }
  }

  .count{
    display:none;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:clamp(22px, 6vmin, 40px);
    font-variant-numeric: tabular-nums;
  }

  .floater{
    position:absolute;
    left:50%; top:10%;
    transform:translateX(-50%);
    font-family:'Space Mono', monospace;
    font-weight:700;
    color:var(--accent);
    font-size:clamp(22px, 4.6vmin, 30px);
    opacity:0;
    pointer-events:none;
  }
  .floater.play{ animation: floatUp 1.2s ease-out 0.18s forwards; }
  @keyframes floatUp{
    0%{ opacity:0; transform:translate(-50%, 0px) scale(0.7); }
    18%{ opacity:1; transform:translate(-50%, -6px) scale(1.08); }
    100%{ opacity:0; transform:translate(-50%, -50px) scale(1); }
  }

  .particle{
    position:absolute;
    left:50%; top:50%;
    width:10px; height:10px;
    border-radius:50%;
    background:var(--accent);
    pointer-events:none;
  }
  .particle.play{ animation: burst 0.7s ease-out forwards; }
  @keyframes burst{
    0%{ opacity:1; transform:translate(-50%,-50%) translate(0,0) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-50%) translate(var(--dx), var(--dy)) scale(0.3); }
  }

  /* ---------- SUBSCRIBE ---------- */
  #subStage{ display:flex; flex-direction:column; align-items:center; gap:26px; }
  .bell-wrap{ width:26%; aspect-ratio:1; }
  .bell-svg{ width:100%; height:100%; overflow:visible; }
  .bell-path{ fill:none; stroke:var(--text); stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
  .bell-wrap.ring .bell-svg{ animation: ring 0.6s ease-in-out; transform-origin:50% 12%; }
  @keyframes ring{
    0%,100%{ transform:rotate(0deg); }
    15%{ transform:rotate(-18deg); }
    35%{ transform:rotate(15deg); }
    55%{ transform:rotate(-10deg); }
    75%{ transform:rotate(6deg); }
    90%{ transform:rotate(-3deg); }
  }

  .sub-btn{
    position:relative;
    overflow:hidden;
    border:2px solid var(--text);
    border-radius:999px;
    padding:16px 40px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:clamp(16px, 3.6vmin, 22px);
    color:var(--text);
    background:transparent;
    letter-spacing:0.02em;
  }
  .sub-btn .fill{
    position:absolute; inset:0;
    background:var(--accent);
    transform:translateX(-100%);
    border-radius:999px;
  }
  .sub-btn.play .fill{ animation: sweep 0.5s ease-out forwards; }
  @keyframes sweep{ to{ transform:translateX(0%); } }
  .sub-btn .label{ position:relative; z-index:1; transition:color 0.15s ease 0.35s; }
  .sub-btn.play .label{ color:#0B0C10; }

  .spark{
    position:absolute;
    width:6px; height:6px;
    background:var(--accent);
    border-radius:50%;
  }
  .spark.play{ animation: sparkle 0.8s ease-out forwards; }
  @keyframes sparkle{
    0%{ opacity:1; transform:translate(0,0) scale(1); }
    100%{ opacity:0; transform:translate(var(--dx), var(--dy)) scale(0.2); }
  }

  /* ---------- panel ---------- */
  .panel{
    position:relative; margin-top:24px;
    background:var(--panel); backdrop-filter:blur(14px);
    border-radius:20px; padding:16px 20px;
    display:flex; flex-direction:column; gap:14px;
    width:min(92vw, 460px);
    transition: opacity 0.2s ease;
    z-index:10;
  }
  body.record-mode .panel{ display:none; }
  .row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .row-label{ font-size:12px; color:var(--text-dim); width:52px; flex:none; }
  button{
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:13px; border:none; border-radius:10px;
    padding:9px 14px; background:#FFFFFF14; color:var(--text); cursor:pointer;
    transition: background 0.2s ease, transform 0.1s ease; white-space:nowrap;
  }
  button:hover{ background:#FFFFFF26; }
  button:active{ transform:scale(0.96); }
  button.primary{ background:var(--accent); color:#fff; font-weight:700; }
  button.opt-active{ background:var(--accent); color:#fff; font-weight:700; }
  button.danger{ background:#FF453A22; color:#FF7B70; }
  .rec-status{ font-size:12px; color:var(--text-dim); font-family:'Space Mono', monospace; }
  .swatch{ width:26px; height:26px; border-radius:50%; border:2px solid transparent; cursor:pointer; flex:none; }
  .swatch.active{ border-color:var(--text); }

  .hint{
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    font-size:12px; color:var(--text-dim); opacity:0; transition:opacity 0.3s ease; pointer-events:none;
  }
  body.record-mode .hint{ opacity:0.6; }

  @media (max-width:480px){
    .panel{ padding:14px 16px; gap:10px; }
    button{ font-size:12px; padding:8px 11px; }
  }
</style>
</head>
<body>

  <div class="hint">Esc / タップで操作パネルを表示</div>

  <div class="stage">
    <div id="likeStage">
      <div class="like-container" id="likeContainer">
        <div class="icon-row" id="iconRow">
          <div class="icon-wrap" id="iconWrapHeart">
            <svg class="icon-svg" viewBox="0 0 100 100"><path class="icon-path" id="iconPathHeart"></path></svg>
          </div>
          <div class="icon-wrap" id="iconWrapThumb" style="display:none;">
            <svg class="icon-svg" viewBox="0 0 100 100"><path class="icon-path" id="iconPathThumb"></path></svg>
          </div>
        </div>
        <div class="floater" id="floater">+1</div>
        <div class="count" id="count">128</div>
      </div>
    </div>

    <div id="subStage" style="display:none;">
      <div class="bell-wrap" id="bellWrap">
        <svg class="bell-svg" viewBox="0 0 100 100">
          <path class="bell-path" d="M50 12 C38 12 30 22 30 36 L30 54 L22 68 L78 68 L70 54 L70 36 C70 22 62 12 50 12 Z"></path>
          <path class="bell-path" d="M42 74 C42 80 45 84 50 84 C55 84 58 80 58 74"></path>
        </svg>
      </div>
      <button class="sub-btn" id="subBtn">
        <span class="fill"></span>
        <span class="label" id="subLabel">登録する</span>
      </button>
    </div>
  </div>

  <div class="panel" id="panel">
    <div class="row">
      <span class="row-label">表示</span>
      <button data-view="like" class="opt-active">いいね</button>
      <button data-view="sub">チャンネル登録</button>
    </div>

    <div class="row" id="iconStyleRow">
      <span class="row-label">アイコン</span>
      <button data-icon="heart" class="opt-active">ハート</button>
      <button data-icon="thumb">親指</button>
      <button data-icon="both">両方(横並び)</button>
    </div>

    <div class="row">
      <span class="row-label">コンテナ</span>
      <button data-frame="off" class="opt-active">オフ(自由配置)</button>
      <button data-frame="on">オン(枠内に収める)</button>
    </div>
    <div class="row" id="frameColorRow" style="display:none;">
      <span class="row-label">枠の色</span>
      <div class="swatch frame-swatch active" style="background:#000000" data-frame-color="#000000"></div>
      <div class="swatch frame-swatch" style="background:#FFFFFF" data-frame-color="#FFFFFF"></div>
      <div class="swatch frame-swatch" style="background:#14151A" data-frame-color="#14151A"></div>
      <div class="swatch frame-swatch" style="background:#F4423A" data-frame-color="#F4423A"></div>
      <div class="swatch frame-swatch" style="background:#FFD23F" data-frame-color="#FFD23F"></div>
    </div>
    <div class="row" id="frameOpacityRow" style="display:none;">
      <span class="row-label">枠の透明度</span>
      <input type="range" id="frameOpacity" min="0" max="100" value="70">
      <span id="frameOpacityValue">70%</span>
    </div>

    <div class="row">
      <button class="primary" id="playBtn">▶ 再生</button>
      <button id="resetViewBtn">リセット</button>
    </div>

    <div class="row">
      <span class="row-label">自動</span>
      <button data-loop="0" class="opt-active">OFF</button>
      <button data-loop="2000">2秒毎</button>
      <button data-loop="3000">3秒毎</button>
      <button data-loop="5000">5秒毎</button>
    </div>

    <div class="row">
      <span class="row-label">配色</span>
      <div class="swatch active" style="background:#F4423A" data-accent="#F4423A"></div>
      <div class="swatch" style="background:#F4F1EA" data-accent="#F4F1EA"></div>
      <div class="swatch" style="background:#FFD23F" data-accent="#FFD23F"></div>
      <div class="swatch" style="background:#00D4FF" data-accent="#00D4FF"></div>
      <div class="swatch" style="background:#9A9A9A" data-accent="#9A9A9A"></div>
    </div>

    <div class="row">
      <span class="row-label">背景</span>
      <button data-bg="" class="opt-active">黒</button>
      <button data-bg="bg-white">白</button>
      <button data-bg="bg-green">グリーンバック</button>
    </div>

    <div class="row">
      <span class="row-label">録画</span>
      <button data-reccount="1" class="opt-active">1回</button>
      <button data-reccount="3">3回</button>
      <button data-reccount="5">5回</button>
    </div>

    <div class="row">
      <button id="recStartBtn">🔴 自動録画スタート</button>
    </div>
    <div class="row" id="recStatusRow" style="display:none;">
      <span class="rec-status" id="recStatusText">録画中...</span>
      <button id="recCancelBtn" class="danger">中止</button>
    </div>

    <div class="row">
      <button id="recordBtn">🎬 収録モード(UIを隠す)</button>
    </div>
  </div>

  <canvas id="recCanvas" style="display:none;"></canvas>

<script>
  const ICONS = {
    heart: 'M50 86 C50 86 12 62 12 36 C12 20 24 10 38 10 C45 10 50 14 50 14 C50 14 55 10 62 10 C76 10 88 20 88 36 C88 62 50 86 50 86 Z',
    thumb: 'M30 46 L30 84 L18 84 L18 46 Z M30 46 L44 14 C46 10 52 10 54 14 C56 18 56 24 54 30 L48 46 L76 46 C82 46 86 52 84 58 L76 80 C74 83 71 84 68 84 L30 84'
  };

  const iconPathHeart = document.getElementById('iconPathHeart');
  const iconPathThumb = document.getElementById('iconPathThumb');
  const iconWrapHeart = document.getElementById('iconWrapHeart');
  const iconWrapThumb = document.getElementById('iconWrapThumb');
  const likeContainer = document.getElementById('likeContainer');
  const floater = document.getElementById('floater');
  const countEl = document.getElementById('count');
  const bellWrap = document.getElementById('bellWrap');
  const subBtn = document.getElementById('subBtn');
  const subLabel = document.getElementById('subLabel');
  const likeStage = document.getElementById('likeStage');
  const subStage = document.getElementById('subStage');
  const iconStyleRow = document.getElementById('iconStyleRow');
  const frameColorRow = document.getElementById('frameColorRow');
  const frameOpacityRow = document.getElementById('frameOpacityRow');
  const frameOpacitySlider = document.getElementById('frameOpacity');
  const frameOpacityValue = document.getElementById('frameOpacityValue');

  let view = 'like';
  let iconStyle = 'heart';
  let likeCount = 128;
  let liked = false;
  let subscribed = false;
  let loopMs = 0;
  let loopTimer = null;
  let framed = false;
  let frameColor = '#000000';
  let frameOpacityPct = 70;

  function setIconPath(){
    iconPathHeart.setAttribute('d', ICONS.heart);
    iconPathThumb.setAttribute('d', ICONS.thumb);
    iconWrapHeart.style.display = (iconStyle === 'heart' || iconStyle === 'both') ? 'flex' : 'none';
    iconWrapThumb.style.display = (iconStyle === 'thumb' || iconStyle === 'both') ? 'flex' : 'none';
  }
  setIconPath();

  function hexToRgba(hex, alphaPct){
    const h = hex.replace('#','');
    const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
    return `rgba(${r},${g},${b},${alphaPct/100})`;
  }
  function applyFrameStyle(){
    likeContainer.classList.toggle('framed', framed);
    likeContainer.style.backgroundColor = framed ? hexToRgba(frameColor, frameOpacityPct) : 'transparent';
  }
  applyFrameStyle();

  function spawnParticles(container, count, colorVar){
    for (let i=0;i<count;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = (Math.PI*2*i/count) + (Math.random()*0.4);
      const dist = 60 + Math.random()*40;
      p.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle)*dist + 'px');
      container.appendChild(p);
      requestAnimationFrame(()=> p.classList.add('play'));
      setTimeout(()=> p.remove(), 800);
    }
  }

  function spawnSparks(container, count){
    const rect = container.getBoundingClientRect();
    for (let i=0;i<count;i++){
      const s = document.createElement('div');
      s.className = 'spark';
      const angle = Math.random()*Math.PI*2;
      const dist = 30 + Math.random()*40;
      s.style.left = (10 + Math.random()*(rect.width-20)) + 'px';
      s.style.top = (Math.random()*rect.height) + 'px';
      s.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
      s.style.setProperty('--dy', Math.sin(angle)*dist + 'px');
      container.appendChild(s);
      requestAnimationFrame(()=> s.classList.add('play'));
      setTimeout(()=> s.remove(), 900);
    }
  }

  function activeIconWraps(){
    const wraps = [];
    if (iconStyle === 'heart' || iconStyle === 'both') wraps.push(iconWrapHeart);
    if (iconStyle === 'thumb' || iconStyle === 'both') wraps.push(iconWrapThumb);
    return wraps;
  }

  function playLike(){
    liked = !liked;
    const wraps = activeIconWraps();
    wraps.forEach(w => {
      w.classList.toggle('filled', liked);
      w.classList.remove('bump');
      void w.offsetWidth;
      w.classList.add('bump');
    });

    // a short pause before the count/+1 lands, so the tap doesn't feel instant
    setTimeout(() => {
      likeCount += liked ? 1 : -1;
      countEl.textContent = likeCount;

      floater.textContent = liked ? '+1' : '−1';
      floater.classList.remove('play');
      void floater.offsetWidth;
      floater.classList.add('play');
    }, 220);

    if (liked) wraps.forEach(w => spawnParticles(w, iconStyle === 'both' ? 7 : 10));
  }

  function playSub(){
    subscribed = !subscribed;
    subBtn.classList.remove('play');
    bellWrap.classList.remove('ring');
    void subBtn.offsetWidth;
    if (subscribed){
      subBtn.classList.add('play');
      subLabel.textContent = '登録済み';
      bellWrap.classList.add('ring');
      spawnSparks(subBtn, 8);
    } else {
      subLabel.textContent = '登録する';
    }
  }

  function playCurrent(){
    if (view === 'like') playLike(); else playSub();
  }

  document.querySelectorAll('[data-view]').forEach(btn => {
    btn.onclick = () => {
      view = btn.dataset.view;
      document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('opt-active'));
      btn.classList.add('opt-active');
      likeStage.style.display = view === 'like' ? 'flex' : 'none';
      subStage.style.display = view === 'sub' ? 'flex' : 'none';
      iconStyleRow.style.display = view === 'like' ? 'flex' : 'none';
    };
  });

  document.querySelectorAll('[data-icon]').forEach(btn => {
    btn.onclick = () => {
      iconStyle = btn.dataset.icon;
      document.querySelectorAll('[data-icon]').forEach(b => b.classList.remove('opt-active'));
      btn.classList.add('opt-active');
      setIconPath();
    };
  });

  document.querySelectorAll('[data-frame]').forEach(btn => {
    btn.onclick = () => {
      framed = btn.dataset.frame === 'on';
      document.querySelectorAll('[data-frame]').forEach(b => b.classList.remove('opt-active'));
      btn.classList.add('opt-active');
      frameColorRow.style.display = framed ? 'flex' : 'none';
      frameOpacityRow.style.display = framed ? 'flex' : 'none';
      applyFrameStyle();
    };
  });

  document.querySelectorAll('[data-frame-color]').forEach(sw => {
    sw.onclick = () => {
      frameColor = sw.dataset.frameColor;
      document.querySelectorAll('[data-frame-color]').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      applyFrameStyle();
    };
  });

  frameOpacitySlider.oninput = () => {
    frameOpacityPct = parseInt(frameOpacitySlider.value, 10);
    frameOpacityValue.textContent = frameOpacityPct + '%';
    applyFrameStyle();
  };

  document.getElementById('playBtn').onclick = playCurrent;
  iconWrapHeart.onclick = () => { if (view === 'like') playLike(); };
  iconWrapThumb.onclick = () => { if (view === 'like') playLike(); };
  subBtn.onclick = () => { if (view === 'sub') playSub(); };

  document.getElementById('resetViewBtn').onclick = () => {
    liked = false; likeCount = 128; countEl.textContent = likeCount;
    iconWrapHeart.classList.remove('filled','bump');
    iconWrapThumb.classList.remove('filled','bump');
    subscribed = false; subLabel.textContent = '登録する';
    subBtn.classList.remove('play'); bellWrap.classList.remove('ring');
  };

  document.querySelectorAll('[data-loop]').forEach(btn => {
    btn.onclick = () => {
      loopMs = parseInt(btn.dataset.loop, 10);
      document.querySelectorAll('[data-loop]').forEach(b => b.classList.remove('opt-active'));
      btn.classList.add('opt-active');
      clearInterval(loopTimer);
      if (loopMs > 0){
        loopTimer = setInterval(playCurrent, loopMs);
      }
    };
  });

  document.querySelectorAll('[data-accent]').forEach(sw => {
    sw.onclick = () => {
      document.documentElement.style.setProperty('--accent', sw.dataset.accent);
      document.querySelectorAll('[data-accent]').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
    };
  });

  document.querySelectorAll('[data-bg]').forEach(btn => {
    btn.onclick = () => {
      document.body.classList.remove('bg-black','bg-white','bg-green');
      if (btn.dataset.bg) document.body.classList.add(btn.dataset.bg);
      document.querySelectorAll('[data-bg]').forEach(b => b.classList.remove('opt-active'));
      btn.classList.add('opt-active');
    };
  });

  document.getElementById('recordBtn').onclick = () => {
    document.body.classList.add('record-mode');
  };
  document.body.addEventListener('click', (e) => {
    if (document.body.classList.contains('record-mode')){
      document.body.classList.remove('record-mode');
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){ document.body.classList.remove('record-mode'); }
    if (e.code === 'Space'){ e.preventDefault(); playCurrent(); }
  });

  /* ---------------- 自動録画(CSSアニメーションをCanvasで再現して収録) ---------------- */
  const recCanvas = document.getElementById('recCanvas');
  const recStartBtn = document.getElementById('recStartBtn');
  const recCancelBtn = document.getElementById('recCancelBtn');
  const recStatusRow = document.getElementById('recStatusRow');
  const recStatusText = document.getElementById('recStatusText');

  let recRepeatCount = 1;
  let recordingActive = false;
  let mediaRecorder = null;
  let recChunks = [];
  let recRafId = null;

  document.querySelectorAll('[data-reccount]').forEach(btn => {
    btn.onclick = () => {
      recRepeatCount = parseInt(btn.dataset.reccount, 10);
      document.querySelectorAll('[data-reccount]').forEach(b => b.classList.remove('opt-active'));
      btn.classList.add('opt-active');
    };
  });

  function getBgFillColor(){
    if (document.body.classList.contains('bg-white')) return '#FFFFFF';
    if (document.body.classList.contains('bg-green')) return '#00FF00';
    return '#000000';
  }
  function getTextColor(){ return getComputedStyle(document.body).getPropertyValue('--text').trim() || '#F4F1EA'; }
  function getAccentColor(){ return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#F4423A'; }

  function interpKeyframes(kf, t){
    // kf: [[ms, value], ...] sorted ascending
    if (t <= kf[0][0]) return kf[0][1];
    for (let i=1;i<kf.length;i++){
      if (t <= kf[i][0]){
        const [t0,v0] = kf[i-1], [t1,v1] = kf[i];
        const f = (t - t0) / (t1 - t0);
        return v0 + (v1 - v0) * f;
      }
    }
    return kf[kf.length-1][1];
  }
  function easeOutCubic(x){ return 1 - Math.pow(1-x, 3); }

  function drawIconPath(ctx, style, size, fillColor, strokeColor, lineWidth){
    const p = new Path2D(ICONS[style]);
    ctx.save();
    ctx.translate(-size/2, -size/2);
    ctx.scale(size/100, size/100);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.lineWidth = lineWidth / (size/100);
    if (fillColor){ ctx.fillStyle = fillColor; ctx.fill(p); }
    ctx.strokeStyle = strokeColor;
    ctx.stroke(p);
    ctx.restore();
  }

  function roundRectPath(ctx, x, y, w, h, r){
    ctx.beginPath();
    if (ctx.roundRect){ ctx.roundRect(x,y,w,h,r); return; }
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function makeBurstOffsets(n){
    const arr = [];
    for (let i=0;i<n;i++){
      const angle = (Math.PI*2*i/n) + Math.random()*0.4;
      const dist = 60 + Math.random()*40;
      arr.push({angle, dist});
    }
    return arr;
  }

  function drawLikeFrame(ctx, W, H, t, burst){
    const bg = getBgFillColor(), textColor = getTextColor(), accent = getAccentColor();
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

    const scaleUnit = H/380;
    const cx = W/2, cy = H*0.42;
    const both = iconStyle === 'both';
    const iconSize = Math.min(W,H) * (both ? 0.22 : 0.30);
    const gap = iconSize * 0.5;

    // frame box (drawn behind, and used to clip motion inside it when framed)
    const rowWidth = both ? (iconSize*2 + gap) : iconSize;
    const padX = iconSize*0.5, padTop = iconSize*0.95, padBottom = iconSize*0.35;
    const boxW = rowWidth + padX*2, boxH = iconSize + padTop + padBottom;
    const boxX = cx - boxW/2, boxY = cy - iconSize/2 - padTop;

    if (framed){
      roundRectPath(ctx, boxX, boxY, boxW, boxH, boxH*0.14);
      ctx.fillStyle = hexToRgba(frameColor, frameOpacityPct);
      ctx.fill();
      ctx.save();
      roundRectPath(ctx, boxX, boxY, boxW, boxH, boxH*0.14);
      ctx.clip();
    }

    let bumpScale = 1;
    if (t < 550){
      bumpScale = interpKeyframes([[0,1],[192,1.32],[330,0.92],[550,1]], t);
    }
    const filled = t >= 0;

    const iconCenters = both ? [cx-(iconSize+gap)/2, cx+(iconSize+gap)/2] : [cx];
    const styles = both ? ['heart','thumb'] : [iconStyle];
    iconCenters.forEach((icx, i) => {
      ctx.save();
      ctx.translate(icx, cy);
      ctx.scale(bumpScale, bumpScale);
      drawIconPath(ctx, styles[i], iconSize, filled ? accent : null, filled ? accent : textColor, 5*scaleUnit);
      ctx.restore();
    });

    const floaterDelay = 400; // matches the JS 220ms pause + CSS 180ms animation-delay
    const ft = t - floaterDelay;
    if (ft >= 0 && ft < 1200){
      const f = {
        op: interpKeyframes([[0,0],[216,1],[1200,0]], ft),
        y: interpKeyframes([[0,0],[216,-6],[1200,-50]], ft) * scaleUnit,
        s: interpKeyframes([[0,0.7],[216,1.08],[1200,1]], ft)
      };
      ctx.save();
      ctx.globalAlpha = Math.max(0, f.op);
      ctx.translate(cx, cy - iconSize*0.95 + f.y);
      ctx.scale(f.s, f.s);
      ctx.fillStyle = accent;
      ctx.font = `700 ${Math.round(iconSize*0.32)}px 'Space Mono', monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('+1', 0, 0);
      ctx.restore();
    }

    if (t < 700){
      const frac = t/700;
      const ease = 1 - Math.pow(1-frac, 2);
      iconCenters.forEach(icx => {
        burst.particles.forEach(p => {
          const dx = Math.cos(p.angle)*p.dist*ease*scaleUnit;
          const dy = Math.sin(p.angle)*p.dist*ease*scaleUnit;
          const opacity = Math.max(0, 1-frac);
          const size = (10*(1-0.7*frac)) * scaleUnit;
          ctx.save();
          ctx.globalAlpha = opacity;
          ctx.fillStyle = accent;
          ctx.beginPath();
          ctx.arc(icx+dx, cy+dy, size/2, 0, Math.PI*2);
          ctx.fill();
          ctx.restore();
        });
      });
    }

    if (framed) ctx.restore();
  }

  function drawBellPath(ctx, size, color, lineWidth){
    const p1 = new Path2D('M50 12 C38 12 30 22 30 36 L30 54 L22 68 L78 68 L70 54 L70 36 C70 22 62 12 50 12 Z');
    const p2 = new Path2D('M42 74 C42 80 45 84 50 84 C55 84 58 80 58 74');
    ctx.save();
    ctx.translate(-size/2, -size/2);
    ctx.scale(size/100, size/100);
    ctx.strokeStyle = color;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.lineWidth = lineWidth / (size/100);
    ctx.stroke(p1); ctx.stroke(p2);
    ctx.restore();
  }

  function drawSubFrame(ctx, W, H, t, burst){
    const bg = getBgFillColor(), textColor = getTextColor(), accent = getAccentColor();
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

    const scaleUnit = H/380;
    const cx = W/2, cy = H*0.36;
    const bellSize = Math.min(W,H)*0.22;

    let rotDeg = 0;
    if (t < 600){
      rotDeg = interpKeyframes([[0,0],[90,-18],[210,15],[330,-10],[450,6],[540,-3],[600,0]], t);
    }
    ctx.save();
    ctx.translate(cx, cy - bellSize*0.38);
    ctx.rotate(rotDeg*Math.PI/180);
    drawBellPath(ctx, bellSize, textColor, 5*scaleUnit);
    ctx.restore();

    const btnW = Math.min(W,H)*0.62, btnH = btnW*0.30;
    const btnX = cx - btnW/2, btnY = cy + bellSize*0.9;

    ctx.strokeStyle = textColor;
    ctx.lineWidth = 2*scaleUnit;
    roundRectPath(ctx, btnX, btnY, btnW, btnH, btnH/2);
    ctx.stroke();

    let fillFrac = 0;
    if (t < 500) fillFrac = easeOutCubic(t/500);
    else fillFrac = 1;
    if (fillFrac > 0){
      ctx.save();
      roundRectPath(ctx, btnX, btnY, btnW, btnH, btnH/2);
      ctx.clip();
      ctx.fillStyle = accent;
      ctx.fillRect(btnX, btnY, btnW*fillFrac, btnH);
      ctx.restore();
    }

    const labelDark = fillFrac > 0.6;
    ctx.fillStyle = labelDark ? '#0B0C10' : textColor;
    ctx.font = `700 ${Math.round(btnH*0.36)}px 'Zen Kaku Gothic New', sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(fillFrac >= 1 ? '登録済み' : '登録する', cx, btnY + btnH/2);

    if (t < 900){
      const frac = t/900;
      const ease = 1 - Math.pow(1-frac, 2);
      burst.sparks.forEach(s => {
        const originX = btnX + btnW*(0.5 + s.originXFrac);
        const originY = btnY + btnH*(0.5 + s.originYFrac);
        const dx = Math.cos(s.angle)*s.dist*ease*scaleUnit;
        const dy = Math.sin(s.angle)*s.dist*ease*scaleUnit;
        const opacity = Math.max(0, 1-frac);
        ctx.save();
        ctx.globalAlpha = opacity;
        ctx.fillStyle = accent;
        ctx.beginPath();
        ctx.arc(originX+dx, originY+dy, 3*scaleUnit, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      });
    }
  }

  recStartBtn.onclick = async () => {
    if (recordingActive) return;
    if (document.fonts && document.fonts.ready) await document.fonts.ready;

    const stageRect = document.querySelector('.stage').getBoundingClientRect();
    const SCALE = 3;
    const W = Math.round(stageRect.width * SCALE), H = Math.round(stageRect.height * SCALE);
    recCanvas.width = W; recCanvas.height = H;
    const ctx = recCanvas.getContext('2d');

    const videoStream = recCanvas.captureStream(30);
    let mimeType = 'video/webm;codecs=vp9';
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';
    try{
      mediaRecorder = new MediaRecorder(videoStream, { mimeType });
    }catch(e){
      alert('このブラウザは自動録画に対応していないみたい。デスクトップのChromeかEdgeで試してみて');
      return;
    }
    recChunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${view}-rec-${Date.now()}.webm`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    };

    // pre-schedule each replay of the animation, based on the selected repeat count
    const LOOP_INTERVAL = view === 'like' ? 1800 : 1600;
    const recDurationMs = 100 + recRepeatCount * LOOP_INTERVAL;
    const triggers = [];
    let baseCount = likeCount;
    for (let i = 0; i < recRepeatCount; i++){
      const time = 100 + i * LOOP_INTERVAL;
      baseCount += 1;
      triggers.push({
        time,
        count: baseCount,
        particles: makeBurstOffsets(10),
        sparks: (() => {
          const arr = [];
          for (let i=0;i<8;i++){
            arr.push({
              angle: Math.random()*Math.PI*2,
              dist: 30 + Math.random()*40,
              originXFrac: Math.random() - 0.5,   // relative to button width, computed at draw time
              originYFrac: Math.random() - 0.5    // relative to button height
            });
          }
          return arr;
        })()
      });
    }

    recordingActive = true;
    recStartBtn.disabled = true;
    recStatusRow.style.display = 'flex';
    recStatusText.textContent = '録画中...';

    const startTime = performance.now();
    function drawLoop(){
      if (!recordingActive) return;
      const elapsed = performance.now() - startTime;
      let active = triggers[0];
      for (const tr of triggers){ if (tr.time <= elapsed) active = tr; }
      const localT = active ? elapsed - active.time : 99999;
      if (view === 'like'){
        drawLikeFrame(ctx, W, H, localT, { count: active ? active.count : likeCount, particles: active ? active.particles : [] });
      } else {
        drawSubFrame(ctx, W, H, localT, { sparks: active ? active.sparks : [] });
      }
      recStatusText.textContent = `録画中... 残り ${Math.max(0, Math.ceil((recDurationMs-elapsed)/1000))}秒`;
      if (elapsed >= recDurationMs){
        stopRecording();
        return;
      }
      recRafId = requestAnimationFrame(drawLoop);
    }

    mediaRecorder.start();
    drawLoop();
  };

  function stopRecording(){
    if (!recordingActive) return;
    recordingActive = false;
    cancelAnimationFrame(recRafId);
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    recStatusText.textContent = '保存中...';
    setTimeout(() => { recStatusRow.style.display = 'none'; }, 1500);
    recStartBtn.disabled = false;
  }

  recCancelBtn.onclick = stopRecording;
</script>
</body>
