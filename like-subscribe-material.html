<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>いいね・登録アニメ素材</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

  :root{
    --bg: #000000;
    --accent: #F4423A;
    --text: #F4F1EA;
    --text-dim: #F4F1EA80;
    --panel: #14151ACC;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
    transition: background 0.4s ease;
    -webkit-tap-highlight-color: transparent;
  }
  body.bg-black{ --bg:#000000; }
  body.bg-white{ --bg:#FFFFFF; --text:#0B0C10; --text-dim:#0B0C1080; --panel:#FFFFFFCC; }
  body.bg-green{ --bg:#00FF00; --text:#050505; --text-dim:#05050580; --panel:#FFFFFFCC; }

  .stage{
    position:relative;
    width:min(70vmin, 460px);
    height:min(70vmin, 460px);
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- LIKE ---------- */
  #likeStage{ display:flex; flex-direction:column; align-items:center; gap:18px; }
  .icon-wrap{ position:relative; width:44%; aspect-ratio:1; display:flex; align-items:center; justify-content:center; }
  .icon-svg{ width:100%; height:100%; overflow:visible; }
  .icon-path{
    fill:none;
    stroke:var(--text);
    stroke-width:5;
    stroke-linejoin:round;
    stroke-linecap:round;
    transition: fill 0.25s ease 0.05s, stroke 0.25s ease;
  }
  .icon-wrap.filled .icon-path{ fill:var(--accent); stroke:var(--accent); }
  .icon-wrap.bump .icon-svg{ animation: bump 0.55s cubic-bezier(.22,1.6,.4,1); }
  @keyframes bump{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.32); }
    60%{ transform:scale(0.92); }
    100%{ transform:scale(1); }
  }

  .count{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:clamp(22px, 6vmin, 40px);
    font-variant-numeric: tabular-nums;
  }

  .floater{
    position:absolute;
    left:50%; top:10%;
    transform:translateX(-50%);
    font-family:'Space Mono', monospace;
    font-weight:700;
    color:var(--accent);
    font-size:clamp(16px, 3.4vmin, 22px);
    opacity:0;
    pointer-events:none;
  }
  .floater.play{ animation: floatUp 0.9s ease-out forwards; }
  @keyframes floatUp{
    0%{ opacity:0; transform:translate(-50%, 0px) scale(0.7); }
    20%{ opacity:1; transform:translate(-50%, -6px) scale(1); }
    100%{ opacity:0; transform:translate(-50%, -46px) scale(1); }
  }

  .particle{
    position:absolute;
    left:50%; top:50%;
    width:10px; height:10px;
    border-radius:50%;
    background:var(--accent);
    pointer-events:none;
  }
  .particle.play{ animation: burst 0.7s ease-out forwards; }
  @keyframes burst{
    0%{ opacity:1; transform:translate(-50%,-50%) translate(0,0) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-50%) translate(var(--dx), var(--dy)) scale(0.3); }
  }

  /* ---------- SUBSCRIBE ---------- */
  #subStage{ display:flex; flex-direction:column; align-items:center; gap:26px; }
  .bell-wrap{ width:26%; aspect-ratio:1; }
  .bell-svg{ width:100%; height:100%; overflow:visible; }
  .bell-path{ fill:none; stroke:var(--text); stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
  .bell-wrap.ring .bell-svg{ animation: ring 0.6s ease-in-out; transform-origin:50% 12%; }
  @keyframes ring{
    0%,100%{ transform:rotate(0deg); }
    15%{ transform:rotate(-18deg); }
    35%{ transform:rotate(15deg); }
    55%{ transform:rotate(-10deg); }
    75%{ transform:rotate(6deg); }
    90%{ transform:rotate(-3deg); }
  }

  .sub-btn{
    position:relative;
    overflow:hidden;
    border:2px solid var(--text);
    border-radius:999px;
    padding:16px 40px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:clamp(16px, 3.6vmin, 22px);
    color:var(--text);
    background:transparent;
    letter-spacing:0.02em;
  }
  .sub-btn .fill{
    position:absolute; inset:0;
    background:var(--accent);
    transform:translateX(-100%);
    border-radius:999px;
  }
  .sub-btn.play .fill{ animation: sweep 0.5s ease-out forwards; }
  @keyframes sweep{ to{ transform:translateX(0%); } }
  .sub-btn .label{ position:relative; z-index:1; transition:color 0.15s ease 0.35s; }
  .sub-btn.play .label{ color:#0B0C10; }

  .spark{
    position:absolute;
    width:6px; height:6px;
    background:var(--accent);
    border-radius:50%;
  }
  .spark.play{ animation: sparkle 0.8s ease-out forwards; }
  @keyframes sparkle{
    0%{ opacity:1; transform:translate(0,0) scale(1); }
    100%{ opacity:0; transform:translate(var(--dx), var(--dy)) scale(0.2); }
  }

  /* ---------- panel ---------- */
  .panel{
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
    background:var(--panel); backdrop-filter:blur(14px);
    border-radius:20px; padding:16px 20px;
    display:flex; flex-direction:column; gap:14px;
    width:min(92vw, 460px); max-height:80vh; overflow-y:auto;
    transition: opacity 0.3s ease, transform 0.3s ease;
    z-index:10;
  }
  body.record-mode .panel{ opacity:0; pointer-events:none; transform:translateX(-50%) translateY(20px); }
  .row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .row-label{ font-size:12px; color:var(--text-dim); width:52px; flex:none; }
  button{
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:13px; border:none; border-radius:10px;
    padding:9px 14px; background:#FFFFFF14; color:var(--text); cursor:pointer;
    transition: background 0.2s ease, transform 0.1s ease; white-space:nowrap;
  }
  button:hover{ background:#FFFFFF26; }
  button:active{ transform:scale(0.96); }
  button.primary{ background:var(--accent); color:#fff; font-weight:700; }
  button.opt-active{ background:var(--accent); color:#fff; font-weight:700; }
  .swatch{ width:26px; height:26px; border-radius:50%; border:2px solid transparent; cursor:pointer; flex:none; }
  .swatch.active{ border-color:var(--text); }

  .hint{
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    font-size:12px; color:var(--text-dim); opacity:0; transition:opacity 0.3s ease; pointer-events:none;
  }
  body.record-mode .hint{ opacity:0.6; }

  @media (max-width:480px){
    .panel{ padding:14px 16px; gap:10px; }
    button{ font-size:12px; padding:8px 11px; }
  }
</style>
</head>
<body>

  <div class="hint">Esc / タップで操作パネルを表示</div>

  <div class="stage">
    <div id="likeStage">
      <div class="icon-wrap" id="iconWrap">
        <svg class="icon-svg" viewBox="0 0 100 100" id="iconSvg"></svg>
        <div class="floater" id="floater">+1</div>
      </div>
      <div class="count" id="count">128</div>
    </div>

    <div id="subStage" style="display:none;">
      <div class="bell-wrap" id="bellWrap">
        <svg class="bell-svg" viewBox="0 0 100 100">
          <path class="bell-path" d="M50 12 C38 12 30 22 30 36 L30 54 L22 68 L78 68 L70 54 L70 36 C70 22 62 12 50 12 Z"></path>
          <path class="bell-path" d="M42 74 C42 80 45 84 50 84 C55 84 58 80 58 74"></path>
        </svg>
      </div>
      <button class="sub-btn" id="subBtn">
        <span class="fill"></span>
        <span class="label" id="subLabel">登録する</span>
      </button>
    </div>
  </div>

  <div class="panel" id="panel">
    <div class="row">
      <span class="row-label">表示</span>
      <button data-view="like" class="opt-active">いいね</button>
      <button data-view="sub">チャンネル登録</button>
    </div>

    <div class="row" id="iconStyleRow">
      <span class="row-label">アイコン</span>
      <button data-icon="heart" class="opt-active">ハート</button>
      <button data-icon="thumb">親指</button>
    </div>

    <div class="row">
      <button class="primary" id="playBtn">▶ 再生</button>
      <button id="resetViewBtn">リセット</button>
    </div>

    <div class="row">
      <span class="row-label">自動</span>
      <button data-loop="0" class="opt-active">OFF</button>
      <button data-loop="2000">2秒毎</button>
      <button data-loop="3000">3秒毎</button>
      <button data-loop="5000">5秒毎</button>
    </div>

    <div class="row">
      <span class="row-label">配色</span>
      <div class="swatch active" style="background:#F4423A" data-accent="#F4423A"></div>
      <div class="swatch" style="background:#F4F1EA" data-accent="#F4F1EA"></div>
      <div class="swatch" style="background:#FFD23F" data-accent="#FFD23F"></div>
      <div class="swatch" style="background:#00D4FF" data-accent="#00D4FF"></div>
      <div class="swatch" style="background:#9A9A9A" data-accent="#9A9A9A"></div>
    </div>

    <div class="row">
      <span class="row-label">背景</span>
      <button data-bg="" class="opt-active">黒</button>
      <button data-bg="bg-white">白</button>
      <button data-bg="bg-green">グリーンバック</button>
    </div>

    <div class="row">
      <button id="recordBtn">🎬 収録モード(UIを隠す)</button>
    </div>
  </div>

<script>
  const ICONS = {
    heart: 'M50 86 C50 86 12 62 12 36 C12 20 24 10 38 10 C45 10 50 14 50 14 C50 14 55 10 62 10 C76 10 88 20 88 36 C88 62 50 86 50 86 Z',
    thumb: 'M30 46 L30 84 L18 84 L18 46 Z M30 46 L44 14 C46 10 52 10 54 14 C56 18 56 24 54 30 L48 46 L76 46 C82 46 86 52 84 58 L76 80 C74 83 71 84 68 84 L30 84'
  };

  const iconSvg = document.getElementById('iconSvg');
  const iconWrap = document.getElementById('iconWrap');
  const floater = document.getElementById('floater');
  const countEl = document.getElementById('count');
  const bellWrap = document.getElementById('bellWrap');
  const subBtn = document.getElementById('subBtn');
  const subLabel = document.getElementById('subLabel');
  const likeStage = document.getElementById('likeStage');
  const subStage = document.getElementById('subStage');
  const iconStyleRow = document.getElementById('iconStyleRow');

  let view = 'like';
  let iconStyle = 'heart';
  let likeCount = 128;
  let liked = false;
  let subscribed = false;
  let loopMs = 0;
  let loopTimer = null;

  function setIconPath(){
    iconSvg.innerHTML = `<path class="icon-path" d="${ICONS[iconStyle]}"></path>`;
  }
  setIconPath();

  function spawnParticles(container, count, colorVar){
    for (let i=0;i<count;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = (Math.PI*2*i/count) + (Math.random()*0.4);
      const dist = 60 + Math.random()*40;
      p.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle)*dist + 'px');
      container.appendChild(p);
      requestAnimationFrame(()=> p.classList.add('play'));
      setTimeout(()=> p.remove(), 800);
    }
  }

  function spawnSparks(container, count){
    const rect = container.getBoundingClientRect();
    for (let i=0;i<count;i++){
      const s = document.createElement('div');
      s.className = 'spark';
      const angle = Math.random()*Math.PI*2;
      const dist = 30 + Math.random()*40;
      s.style.left = (10 + Math.random()*(rect.width-20)) + 'px';
      s.style.top = (Math.random()*rect.height) + 'px';
      s.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
      s.style.setProperty('--dy', Math.sin(angle)*dist + 'px');
      container.appendChild(s);
      requestAnimationFrame(()=> s.classList.add('play'));
      setTimeout(()=> s.remove(), 900);
    }
  }

  function playLike(){
    liked = !liked;
    iconWrap.classList.toggle('filled', liked);
    iconWrap.classList.remove('bump');
    void iconWrap.offsetWidth;
    iconWrap.classList.add('bump');

    likeCount += liked ? 1 : -1;
    countEl.textContent = likeCount;

    floater.textContent = liked ? '+1' : '−1';
    floater.classList.remove('play');
    void floater.offsetWidth;
    floater.classList.add('play');

    if (liked) spawnParticles(iconWrap, 10);
  }

  function playSub(){
    subscribed = !subscribed;
    subBtn.classList.remove('play');
    bellWrap.classList.remove('ring');
    void subBtn.offsetWidth;
    if (subscribed){
      subBtn.classList.add('play');
      subLabel.textContent = '登録済み';
      bellWrap.classList.add('ring');
      spawnSparks(subBtn, 8);
    } else {
      subLabel.textContent = '登録する';
    }
  }

  function playCurrent(){
    if (view === 'like') playLike(); else playSub();
  }

  document.querySelectorAll('[data-view]').forEach(btn => {
    btn.onclick = () => {
      view = btn.dataset.view;
      document.querySelectorAll('[data-view]').forEach(b => b.classList.remove('opt-active'));
      btn.classList.add('opt-active');
      likeStage.style.display = view === 'like' ? 'flex' : 'none';
      subStage.style.display = view === 'sub' ? 'flex' : 'none';
      iconStyleRow.style.display = view === 'like' ? 'flex' : 'none';
    };
  });

  document.querySelectorAll('[data-icon]').forEach(btn => {
    btn.onclick = () => {
      iconStyle = btn.dataset.icon;
      document.querySelectorAll('[data-icon]').forEach(b => b.classList.remove('opt-active'));
      btn.classList.add('opt-active');
      setIconPath();
    };
  });

  document.getElementById('playBtn').onclick = playCurrent;
  iconWrap.onclick = () => { if (view === 'like') playLike(); };
  subBtn.onclick = () => { if (view === 'sub') playSub(); };

  document.getElementById('resetViewBtn').onclick = () => {
    liked = false; likeCount = 128; countEl.textContent = likeCount;
    iconWrap.classList.remove('filled','bump');
    subscribed = false; subLabel.textContent = '登録する';
    subBtn.classList.remove('play'); bellWrap.classList.remove('ring');
  };

  document.querySelectorAll('[data-loop]').forEach(btn => {
    btn.onclick = () => {
      loopMs = parseInt(btn.dataset.loop, 10);
      document.querySelectorAll('[data-loop]').forEach(b => b.classList.remove('opt-active'));
      btn.classList.add('opt-active');
      clearInterval(loopTimer);
      if (loopMs > 0){
        loopTimer = setInterval(playCurrent, loopMs);
      }
    };
  });

  document.querySelectorAll('.swatch').forEach(sw => {
    sw.onclick = () => {
      document.documentElement.style.setProperty('--accent', sw.dataset.accent);
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
    };
  });

  document.querySelectorAll('[data-bg]').forEach(btn => {
    btn.onclick = () => {
      document.body.classList.remove('bg-black','bg-white','bg-green');
      if (btn.dataset.bg) document.body.classList.add(btn.dataset.bg);
      document.querySelectorAll('[data-bg]').forEach(b => b.classList.remove('opt-active'));
      btn.classList.add('opt-active');
    };
  });

  document.getElementById('recordBtn').onclick = () => {
    document.body.classList.add('record-mode');
  };
  document.body.addEventListener('click', (e) => {
    if (document.body.classList.contains('record-mode')){
      document.body.classList.remove('record-mode');
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){ document.body.classList.remove('record-mode'); }
    if (e.code === 'Space'){ e.preventDefault(); playCurrent(); }
  });
</script>
</body>
</html>
