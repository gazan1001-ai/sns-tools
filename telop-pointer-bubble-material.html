<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テロップ・指差し・吹き出し素材</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

  :root{
    --bg: #000000;
    --accent: #FFD23F;
    --text: #F4F1EA;
    --text-dim: #F4F1EA80;
    --panel: #14151ACC;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', system-ui, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    min-height:100vh; overflow-y:auto; overflow-x:hidden;
    padding: 24px 0;
    transition: background 0.4s ease;
    -webkit-tap-highlight-color: transparent;
  }
  body.record-mode{ justify-content:center; }
  body.bg-black{ --bg:#000000; }
  body.bg-white{ --bg:#FFFFFF; --text:#0B0C10; --text-dim:#0B0C1080; --panel:#FFFFFFCC; }
  body.bg-green{ --bg:#00FF00; --text:#050505; --text-dim:#05050580; --panel:#FFFFFFCC; }

  .stage{
    position:relative;
    width:min(92vw, 640px);
    height:min(70vh, 460px);
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- テロップ ---------- */
  #telopStage{ position:relative; display:flex; align-items:center; justify-content:center; width:100%; }
  .telop{
    position:relative;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:900;
    font-size:clamp(28px, 6.2vw, 56px);
    color:var(--text);
    padding:10px 6px;
    white-space:nowrap;
  }
  .telop-bar{
    position:absolute; inset:0 -14px;
    background:var(--accent);
    transform:scaleX(0);
    transform-origin:left center;
    z-index:0;
  }
  .telop-box{
    position:absolute; inset:0 -14px;
    border:6px solid var(--accent);
    transform:scaleX(0);
    transform-origin:left center;
    z-index:0;
  }
  .telop-label{ position:relative; z-index:1; }

  .telop.style-pop .telop-label.play{ animation: telopPop 0.5s cubic-bezier(.2,1.7,.4,1); }
  @keyframes telopPop{
    0%{ transform:scale(0) rotate(-6deg); opacity:0; }
    60%{ transform:scale(1.12) rotate(2deg); opacity:1; }
    100%{ transform:scale(1) rotate(0deg); opacity:1; }
  }
  .telop.style-bar .telop-bar.play{ animation: telopBar 0.35s ease-out forwards; }
  .telop.style-bar .telop-label{ opacity:0; }
  .telop.style-bar .telop-label.play{ animation: telopFade 0.4s ease-out 0.25s forwards; }
  .telop.style-box .telop-box.play{ animation: telopBar 0.4s ease-out forwards; }
  .telop.style-box .telop-label{ opacity:0; }
  .telop.style-box .telop-label.play{ animation: telopFade 0.4s ease-out 0.3s forwards; }
  @keyframes telopBar{ to{ transform:scaleX(1); } }
  @keyframes telopFade{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  .telop.style-bar .telop-label.play{ color:#0B0C10; }
  body.bg-white .telop.style-bar .telop-label.play{ color:#F4F1EA; }

  /* ---------- 指差し ---------- */
  #pointerStage{ position:relative; width:100%; height:100%; cursor:crosshair; }
  #pointerStage .hint-tap{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:14px; pointer-events:none;
  }
  .pointer-marker{ position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:8px; }
  .pointer-marker.circle .p-shape{
    width:70px; height:70px; border-radius:50%; border:5px solid var(--accent);
  }
  .pointer-marker.circle .p-shape.idle{ animation: ringPulse 1.4s ease-in-out infinite; }
  @keyframes ringPulse{
    0%,100%{ transform:scale(0.9); opacity:0.6; }
    50%{ transform:scale(1.12); opacity:1; }
  }
  .pointer-marker.arrow .p-shape{
    width:0; height:0;
    border-left:20px solid transparent; border-right:20px solid transparent;
    border-top:34px solid var(--accent);
    transform:translateY(-14px);
  }
  .pointer-marker.arrow .p-shape.idle{ animation: arrowBounce 0.9s ease-in-out infinite; }
  @keyframes arrowBounce{
    0%,100%{ transform:translateY(-14px); }
    50%{ transform:translateY(-2px); }
  }
  .pointer-marker.hand .p-shape{ width:52px; height:52px; }
  .pointer-marker.hand .p-shape.idle{ animation: handTap 0.9s ease-in-out infinite; }
  @keyframes handTap{
    0%,100%{ transform:translate(0,0) rotate(0deg); }
    40%{ transform:translate(4px,4px) rotate(-4deg); }
  }
  .p-shape.enter{ animation: markerIn 0.5s cubic-bezier(.2,1.7,.4,1); }
  @keyframes markerIn{
    0%{ transform:scale(0); opacity:0; }
    70%{ transform:scale(1.2); opacity:1; }
    100%{ transform:scale(1); opacity:1; }
  }
  .pointer-label{
    background:var(--accent); color:#0B0C10; font-weight:700;
    font-size:14px; padding:6px 14px; border-radius:999px; white-space:nowrap;
  }

  /* ---------- 吹き出し ---------- */
  #bubbleStage{ position:relative; width:100%; display:flex; align-items:center; justify-content:center; }
  .bubble{
    position:relative;
    max-width:80%;
    padding:20px 26px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:clamp(18px, 3.4vw, 26px);
    color:#0B0C10;
    background:var(--text);
    border-radius:22px;
    opacity:0;
    transform:scale(0.6);
  }
  .bubble.play{ animation: bubbleIn 0.45s cubic-bezier(.2,1.7,.4,1) forwards; }
  .bubble.fadeout{ animation: bubbleOut 0.4s ease-in forwards; }
  @keyframes bubbleIn{
    0%{ opacity:0; transform:scale(0.5); }
    70%{ opacity:1; transform:scale(1.08); }
    100%{ opacity:1; transform:scale(1); }
  }
  @keyframes bubbleOut{ to{ opacity:0; transform:scale(0.85) translateY(-8px); } }
  .bubble::after{
    content:''; position:absolute; left:36px; bottom:-16px;
    border-width:16px 12px 0 0; border-style:solid;
    border-color:var(--text) transparent transparent transparent;
  }
  .bubble.style-neon{ background:transparent; border:3px solid var(--accent); color:var(--text); box-shadow:0 0 18px var(--accent); }
  .bubble.style-neon::after{ border-color:var(--accent) transparent transparent transparent; }
  .bubble.style-jagged{
    background:var(--accent); color:#0B0C10; border-radius:6px;
    clip-path: polygon(2% 12%, 10% 2%, 22% 10%, 34% 0%, 46% 9%, 58% 1%, 70% 10%, 82% 2%, 94% 12%,
                        100% 30%, 92% 42%, 100% 55%, 90% 66%, 96% 82%, 82% 78%, 74% 92%,
                        62% 82%, 50% 96%, 38% 84%, 24% 94%, 18% 80%, 4% 84%, 10% 66%, 0% 50%, 8% 30%);
  }
  .bubble.style-jagged::after{ display:none; }

  /* ---------- shared panel ---------- */
  .panel{
    position:relative;
    margin-top:24px;
    background:var(--panel); backdrop-filter:blur(14px);
    border-radius:20px; padding:16px 20px;
    display:flex; flex-direction:column; gap:14px;
    width:min(92vw, 480px);
    transition: opacity 0.2s ease;
    z-index:10;
  }
  body.record-mode .panel{ display:none; }
  .row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .row-label{ font-size:12px; color:var(--text-dim); width:52px; flex:none; }
  button{
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:13px; border:none; border-radius:10px;
    padding:9px 14px; background:#FFFFFF14; color:var(--text); cursor:pointer;
    transition: background 0.2s ease, transform 0.1s ease; white-space:nowrap;
  }
  button:hover{ background:#FFFFFF26; }
  button:active{ transform:scale(0.96); }
  button.primary{ background:var(--accent); color:#0B0C10; font-weight:700; }
  button.opt-active{ background:var(--accent); color:#0B0C10; font-weight:700; }
  button.danger{ background:#FF453A22; color:#FF7B70; }
  .rec-status{ font-size:12px; color:var(--text-dim); font-family:'Space Mono', monospace; }
  .swatch{ width:26px; height:26px; border-radius:50%; border:2px solid transparent; cursor:pointer; flex:none; }
  .swatch.active{ border-color:var(--text); }
  input[type="text"]{
    flex:1; min-width:140px;
    background:#FFFFFF10; border:1px solid #FFFFFF22; border-radius:8px;
    color:var(--text); font-family:'Zen Kaku Gothic New', sans-serif; font-size:14px; padding:9px 10px;
  }
  .hint{
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    font-size:12px; color:var(--text-dim); opacity:0; transition:opacity 0.3s ease; pointer-events:none;
  }
  body.record-mode .hint{ opacity:0.6; }
  @media (max-width:480px){
    .panel{ padding:14px 16px; gap:10px; }
    button{ font-size:12px; padding:8px 11px; }
  }
</style>
</head>
<body>

  <div class="hint">Esc / タップで操作パネルを表示</div>

  <div class="stage">
    <div id="telopStage">
      <div class="telop style-pop" id="telop">
        <div class="telop-bar"></div>
        <div class="telop-box"></div>
        <div class="telop-label play" id="telopLabel">神回すぎる</div>
      </div>
    </div>

    <div id="pointerStage" style="display:none;">
      <div class="hint-tap" id="pointerHint">ステージをタップして矢印を置く位置を決めてね</div>
    </div>

    <div id="bubbleStage" style="display:none;">
      <div class="bubble style-normal play" id="bubble">それな</div>
    </div>
  </div>

  <div class="panel" id="panel">
    <div class="row">
      <span class="row-label">種類</span>
      <button data-mode="telop" class="opt-active">テロップ</button>
      <button data-mode="pointer">指差し</button>
      <button data-mode="bubble">吹き出し</button>
    </div>

    <div class="row" id="textRow">
      <span class="row-label">文字</span>
      <input type="text" id="textInput" value="神回すぎる">
    </div>

    <div class="row" id="telopStyleRow">
      <span class="row-label">演出</span>
      <button data-telop-style="pop" class="opt-active">ポップ</button>
      <button data-telop-style="bar">帯スライド</button>
      <button data-telop-style="box">囲み枠</button>
    </div>

    <div class="row" id="pointerStyleRow" style="display:none;">
      <span class="row-label">形</span>
      <button data-pointer-style="circle" class="opt-active">丸で囲む</button>
      <button data-pointer-style="arrow">矢印</button>
      <button data-pointer-style="hand">指マーク</button>
    </div>

    <div class="row" id="bubbleStyleRow" style="display:none;">
      <span class="row-label">形</span>
      <button data-bubble-style="normal" class="opt-active">通常</button>
      <button data-bubble-style="neon">ネオン</button>
      <button data-bubble-style="jagged">びっくり</button>
    </div>

    <div class="row">
      <button class="primary" id="playBtn">▶ 再生</button>
      <button id="resetBtn">リセット</button>
    </div>

    <div class="row">
      <span class="row-label">自動</span>
      <button data-loop="0" class="opt-active">OFF</button>
      <button data-loop="2000">2秒毎</button>
      <button data-loop="3000">3秒毎</button>
      <button data-loop="5000">5秒毎</button>
    </div>

    <div class="row">
      <span class="row-label">配色</span>
      <div class="swatch active" style="background:#FFD23F" data-accent="#FFD23F"></div>
      <div class="swatch" style="background:#F4423A" data-accent="#F4423A"></div>
      <div class="swatch" style="background:#00D4FF" data-accent="#00D4FF"></div>
      <div class="swatch" style="background:#F4F1EA" data-accent="#F4F1EA"></div>
      <div class="swatch" style="background:#9A9A9A" data-accent="#9A9A9A"></div>
    </div>

    <div class="row">
      <span class="row-label">背景</span>
      <button data-bg="" class="opt-active">黒</button>
      <button data-bg="bg-white">白</button>
      <button data-bg="bg-green">グリーンバック</button>
    </div>

    <div class="row">
      <span class="row-label">録画</span>
      <button data-recdur="3000" class="opt-active">3秒</button>
      <button data-recdur="5000">5秒</button>
      <button data-recdur="10000">10秒</button>
    </div>

    <div class="row">
      <button id="recStartBtn">🔴 自動録画スタート</button>
    </div>
    <div class="row" id="recStatusRow" style="display:none;">
      <span class="rec-status" id="recStatusText">録画中...</span>
      <button id="recCancelBtn" class="danger">中止</button>
    </div>

    <div class="row">
      <button id="recordBtn">🎬 収録モード(UIを隠す)</button>
    </div>
  </div>

  <canvas id="recCanvas" style="display:none;"></canvas>

<script>
  const telopStage = document.getElementById('telopStage');
  const pointerStage = document.getElementById('pointerStage');
  const bubbleStage = document.getElementById('bubbleStage');
  const telop = document.getElementById('telop');
  const telopLabel = document.getElementById('telopLabel');
  const bubble = document.getElementById('bubble');
  const textInput = document.getElementById('textInput');
  const textRow = document.getElementById('textRow');
  const telopStyleRow = document.getElementById('telopStyleRow');
  const pointerStyleRow = document.getElementById('pointerStyleRow');
  const bubbleStyleRow = document.getElementById('bubbleStyleRow');
  const pointerHint = document.getElementById('pointerHint');

  let mode = 'telop';
  let telopStyle = 'pop';
  let pointerStyle = 'circle';
  let bubbleStyle = 'normal';
  let pointerAnchor = null; // {xPct, yPct}
  let loopMs = 0;
  let loopTimer = null;
  let bubbleTimeout = null;

  const DEFAULT_TEXT = { telop: '神回すぎる', pointer: 'ここ見て', bubble: 'それな' };

  function setMode(next){
    mode = next;
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('opt-active', b.dataset.mode === mode));
    telopStage.style.display = mode === 'telop' ? 'flex' : 'none';
    pointerStage.style.display = mode === 'pointer' ? 'block' : 'none';
    bubbleStage.style.display = mode === 'bubble' ? 'flex' : 'none';
    telopStyleRow.style.display = mode === 'telop' ? 'flex' : 'none';
    pointerStyleRow.style.display = mode === 'pointer' ? 'flex' : 'none';
    bubbleStyleRow.style.display = mode === 'bubble' ? 'flex' : 'none';
    textInput.value = DEFAULT_TEXT[mode];
  }

  function playTelop(){
    telop.className = `telop style-${telopStyle}`;
    telopLabel.textContent = textInput.value || DEFAULT_TEXT.telop;
    telopLabel.classList.remove('play');
    const bar = telop.querySelector('.telop-bar');
    const box = telop.querySelector('.telop-box');
    bar.classList.remove('play'); box.classList.remove('play');
    void telop.offsetWidth;
    telopLabel.classList.add('play');
    bar.classList.add('play'); box.classList.add('play');
  }

  function renderPointerMarker(){
    pointerStage.querySelectorAll('.pointer-marker').forEach(m => m.remove());
    if (!pointerAnchor) return;
    const marker = document.createElement('div');
    marker.className = `pointer-marker ${pointerStyle}`;
    marker.style.left = pointerAnchor.xPct + '%';
    marker.style.top = pointerAnchor.yPct + '%';

    let shapeHTML = '';
    if (pointerStyle === 'circle'){
      shapeHTML = `<div class="p-shape idle"></div>`;
    } else if (pointerStyle === 'arrow'){
      shapeHTML = `<div class="p-shape idle"></div>`;
    } else {
      shapeHTML = `<svg class="p-shape idle" viewBox="0 0 100 100"><path d="M30 46 L30 84 L18 84 L18 46 Z M30 46 L44 14 C46 10 52 10 54 14 C56 18 56 24 54 30 L48 46 L76 46 C82 46 86 52 84 58 L76 80 C74 83 71 84 68 84 L30 84" fill="var(--accent)"></path></svg>`;
    }
    const labelHTML = `<div class="pointer-label">${(textInput.value || DEFAULT_TEXT.pointer)}</div>`;
    marker.innerHTML = pointerStyle === 'arrow'
      ? shapeHTML + labelHTML
      : labelHTML + shapeHTML;
    pointerStage.appendChild(marker);
    pointerHint.style.display = 'none';
  }

  function playPointer(){
    if (!pointerAnchor){
      pointerAnchor = { xPct: 50, yPct: 50 };
    }
    renderPointerMarker();
    const shape = pointerStage.querySelector('.p-shape');
    if (shape){
      shape.classList.remove('enter');
      void shape.offsetWidth;
      shape.classList.add('enter');
    }
  }

  pointerStage.addEventListener('click', (e) => {
    if (mode !== 'pointer' || document.body.classList.contains('record-mode')) return;
    const rect = pointerStage.getBoundingClientRect();
    pointerAnchor = {
      xPct: ((e.clientX - rect.left) / rect.width) * 100,
      yPct: ((e.clientY - rect.top) / rect.height) * 100
    };
    playPointer();
  });

  function playBubble(){
    clearTimeout(bubbleTimeout);
    bubble.className = `bubble style-${bubbleStyle}`;
    bubble.textContent = textInput.value || DEFAULT_TEXT.bubble;
    void bubble.offsetWidth;
    bubble.classList.add('play');
    if (loopMs > 0){
      bubbleTimeout = setTimeout(() => {
        bubble.classList.add('fadeout');
      }, Math.max(1200, loopMs - 500));
    }
  }

  function playCurrent(){
    if (mode === 'telop') playTelop();
    else if (mode === 'pointer') playPointer();
    else playBubble();
  }

  document.querySelectorAll('[data-mode]').forEach(btn => {
    btn.onclick = () => setMode(btn.dataset.mode);
  });

  document.querySelectorAll('[data-telop-style]').forEach(btn => {
    btn.onclick = () => {
      telopStyle = btn.dataset.telopStyle;
      document.querySelectorAll('[data-telop-style]').forEach(b => b.classList.remove('opt-active'));
      btn.classList.add('opt-active');
      playTelop();
    };
  });

  document.querySelectorAll('[data-pointer-style]').forEach(btn => {
    btn.onclick = () => {
      pointerStyle = btn.dataset.pointerStyle;
      document.querySelectorAll('[data-pointer-style]').forEach(b => b.classList.remove('opt-active'));
      btn.classList.add('opt-active');
      if (pointerAnchor) playPointer();
    };
  });

  document.querySelectorAll('[data-bubble-style]').forEach(btn => {
    btn.onclick = () => {
      bubbleStyle = btn.dataset.bubbleStyle;
      document.querySelectorAll('[data-bubble-style]').forEach(b => b.classList.remove('opt-active'));
      btn.classList.add('opt-active');
      playBubble();
    };
  });

  document.getElementById('playBtn').onclick = playCurrent;

  document.getElementById('resetBtn').onclick = () => {
    pointerAnchor = null;
    pointerStage.querySelectorAll('.pointer-marker').forEach(m => m.remove());
    pointerHint.style.display = 'flex';
    bubble.classList.remove('play','fadeout');
    telopLabel.classList.remove('play');
  };

  document.querySelectorAll('[data-loop]').forEach(btn => {
    btn.onclick = () => {
      loopMs = parseInt(btn.dataset.loop, 10);
      document.querySelectorAll('[data-loop]').forEach(b => b.classList.remove('opt-active'));
      btn.classList.add('opt-active');
      clearInterval(loopTimer);
      if (loopMs > 0){
        loopTimer = setInterval(playCurrent, loopMs);
      }
    };
  });

  document.querySelectorAll('.swatch').forEach(sw => {
    sw.onclick = () => {
      document.documentElement.style.setProperty('--accent', sw.dataset.accent);
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
    };
  });

  document.querySelectorAll('[data-bg]').forEach(btn => {
    btn.onclick = () => {
      document.body.classList.remove('bg-black','bg-white','bg-green');
      if (btn.dataset.bg) document.body.classList.add(btn.dataset.bg);
      document.querySelectorAll('[data-bg]').forEach(b => b.classList.remove('opt-active'));
      btn.classList.add('opt-active');
    };
  });

  document.getElementById('recordBtn').onclick = () => {
    document.body.classList.add('record-mode');
  };
  document.body.addEventListener('click', (e) => {
    if (document.body.classList.contains('record-mode')){
      document.body.classList.remove('record-mode');
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){ document.body.classList.remove('record-mode'); }
    if (e.code === 'Space'){ e.preventDefault(); playCurrent(); }
  });

  /* ---------------- 自動録画(CSSアニメーションをCanvasで再現して収録) ---------------- */
  const recCanvas = document.getElementById('recCanvas');
  const recStartBtn = document.getElementById('recStartBtn');
  const recCancelBtn = document.getElementById('recCancelBtn');
  const recStatusRow = document.getElementById('recStatusRow');
  const recStatusText = document.getElementById('recStatusText');

  let recDurationMs = 3000;
  let recordingActive = false;
  let mediaRecorder = null;
  let recChunks = [];
  let recRafId = null;

  document.querySelectorAll('[data-recdur]').forEach(btn => {
    btn.onclick = () => {
      recDurationMs = parseInt(btn.dataset.recdur, 10);
      document.querySelectorAll('[data-recdur]').forEach(b => b.classList.remove('opt-active'));
      btn.classList.add('opt-active');
    };
  });

  function getBgFillColor(){
    if (document.body.classList.contains('bg-white')) return '#FFFFFF';
    if (document.body.classList.contains('bg-green')) return '#00FF00';
    return '#000000';
  }
  function getTextColor(){ return getComputedStyle(document.body).getPropertyValue('--text').trim() || '#F4F1EA'; }
  function getAccentColor(){ return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#FFD23F'; }

  function interpKeyframes(kf, t){
    if (t <= kf[0][0]) return kf[0][1];
    for (let i=1;i<kf.length;i++){
      if (t <= kf[i][0]){
        const [t0,v0] = kf[i-1], [t1,v1] = kf[i];
        const f = (t - t0) / (t1 - t0);
        return v0 + (v1 - v0) * f;
      }
    }
    return kf[kf.length-1][1];
  }

  function roundRectPath(ctx, x, y, w, h, r){
    ctx.beginPath();
    if (ctx.roundRect){ ctx.roundRect(x,y,w,h,r); return; }
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawLabelPill(ctx, x, y, text, accent, unit){
    ctx.save();
    ctx.font = `700 ${Math.round(14*unit)}px 'Zen Kaku Gothic New', sans-serif`;
    const tw = ctx.measureText(text).width;
    const padX = 14*unit, h = 28*unit;
    const w = tw + padX*2;
    roundRectPath(ctx, x-w/2, y-h/2, w, h, h/2);
    ctx.fillStyle = accent;
    ctx.fill();
    ctx.fillStyle = '#0B0C10';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  function drawJaggedBlob(ctx, w, h){
    const pts = [[2,12],[10,2],[22,10],[34,0],[46,9],[58,1],[70,10],[82,2],[94,12],
      [100,30],[92,42],[100,55],[90,66],[96,82],[82,78],[74,92],
      [62,82],[50,96],[38,84],[24,94],[18,80],[4,84],[10,66],[0,50],[8,30]];
    ctx.beginPath();
    pts.forEach(([px,py], i) => {
      const x = (px/100 - 0.5)*w, y = (py/100 - 0.5)*h;
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.closePath();
    ctx.fill();
  }

  function drawTelopFrame(ctx, W, H, t){
    const accent = getAccentColor(), textColor = getTextColor();
    const text = textInput.value || DEFAULT_TEXT.telop;
    const cx = W/2, cy = H/2;
    const fontSize = Math.min(W,H) * 0.13;
    ctx.font = `900 ${Math.round(fontSize)}px 'Zen Kaku Gothic New', sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const textWidth = ctx.measureText(text).width;
    const padX = fontSize*0.22, padY = fontSize*0.22;
    const boxW = textWidth + padX*2, boxH = fontSize*1.25 + padY;

    if (telopStyle === 'pop'){
      let scale=1, rot=0, op=1;
      if (t < 500){
        scale = interpKeyframes([[0,0],[300,1.12],[500,1]], t);
        rot = interpKeyframes([[0,-6],[300,2],[500,0]], t);
        op = interpKeyframes([[0,0],[300,1],[500,1]], t);
      }
      ctx.save();
      ctx.globalAlpha = op;
      ctx.translate(cx,cy);
      ctx.rotate(rot*Math.PI/180);
      ctx.scale(scale,scale);
      ctx.fillStyle = textColor;
      ctx.fillText(text, 0, 0);
      ctx.restore();
    } else {
      let barScale = t < 350 ? t/350 : 1;
      ctx.save();
      if (telopStyle === 'bar'){
        ctx.fillStyle = accent;
        ctx.fillRect(cx-boxW/2, cy-boxH/2, boxW*barScale, boxH);
      } else {
        ctx.strokeStyle = accent; ctx.lineWidth = 6;
        ctx.strokeRect(cx-boxW/2, cy-boxH/2, boxW*barScale, boxH);
      }
      ctx.restore();

      const delay = telopStyle === 'bar' ? 250 : 300;
      let labelOp = 0, labelY = 0;
      if (t >= delay){
        const lt = t - delay;
        labelOp = interpKeyframes([[0,0],[400,1]], lt);
        labelY = interpKeyframes([[0,6],[400,0]], lt);
      }
      if (labelOp > 0){
        ctx.save();
        ctx.globalAlpha = labelOp;
        ctx.fillStyle = telopStyle === 'bar' ? '#0B0C10' : textColor;
        ctx.translate(0, labelY*(H/380));
        ctx.fillText(text, cx, cy);
        ctx.restore();
      }
    }
  }

  function drawPointerFrame(ctx, W, H, t){
    const accent = getAccentColor();
    const anchor = pointerAnchor || { xPct:50, yPct:50 };
    const label = textInput.value || DEFAULT_TEXT.pointer;
    const x = W * anchor.xPct/100, y = H * anchor.yPct/100;
    const unit = Math.min(W,H)/380;

    let entScale=1, entOp=1;
    if (t < 500){
      entScale = interpKeyframes([[0,0],[350,1.2],[500,1]], t);
      entOp = interpKeyframes([[0,0],[350,1],[500,1]], t);
    }
    const period = pointerStyle === 'circle' ? 1400 : 900;
    const idleT = t % period;

    ctx.save();
    ctx.globalAlpha = entOp;
    ctx.translate(x,y);
    ctx.scale(entScale, entScale);

    if (pointerStyle === 'circle'){
      const pulseScale = interpKeyframes([[0,0.9],[700,1.12],[1400,0.9]], idleT);
      const pulseOp = interpKeyframes([[0,0.6],[700,1],[1400,0.6]], idleT);
      ctx.save();
      ctx.globalAlpha *= pulseOp;
      ctx.scale(pulseScale, pulseScale);
      ctx.strokeStyle = accent; ctx.lineWidth = 5*unit;
      ctx.beginPath(); ctx.arc(0,0,35*unit,0,Math.PI*2); ctx.stroke();
      ctx.restore();
      drawLabelPill(ctx, 0, 55*unit, label, accent, unit);
    } else if (pointerStyle === 'arrow'){
      const dy = interpKeyframes([[0,-14],[450,-2],[900,-14]], idleT) * unit;
      ctx.save();
      ctx.translate(0, dy);
      ctx.fillStyle = accent;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-20*unit, -34*unit);
      ctx.lineTo(20*unit, -34*unit);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      drawLabelPill(ctx, 0, 20*unit, label, accent, unit);
    } else { // hand
      const hx = interpKeyframes([[0,0],[360,4],[900,0]], idleT) * unit;
      const hy = interpKeyframes([[0,0],[360,4],[900,0]], idleT) * unit;
      const hrot = interpKeyframes([[0,0],[360,-4],[900,0]], idleT);
      ctx.save();
      ctx.translate(hx,hy);
      ctx.rotate(hrot*Math.PI/180);
      ctx.translate(-26*unit, -26*unit);
      ctx.scale(unit,unit);
      const p = new Path2D('M30 46 L30 84 L18 84 L18 46 Z M30 46 L44 14 C46 10 52 10 54 14 C56 18 56 24 54 30 L48 46 L76 46 C82 46 86 52 84 58 L76 80 C74 83 71 84 68 84 L30 84');
      ctx.fillStyle = accent;
      ctx.fill(p);
      ctx.restore();
      drawLabelPill(ctx, 0, 62*unit, label, accent, unit);
    }
    ctx.restore();
  }

  function drawBubbleFrame(ctx, W, H, t){
    const accent = getAccentColor(), textColor = getTextColor();
    const text = textInput.value || DEFAULT_TEXT.bubble;
    const cx = W/2, cy = H/2;
    const unit = Math.min(W,H)/380;

    let scale=1, op=1;
    if (t < 450){
      scale = interpKeyframes([[0,0.5],[315,1.08],[450,1]], t);
      op = interpKeyframes([[0,0],[315,1],[450,1]], t);
    }
    ctx.font = `700 ${Math.round(20*unit)}px 'Zen Kaku Gothic New', sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const maxWidth = W*0.8;
    const tw = Math.min(ctx.measureText(text).width, maxWidth);
    const padX = 26*unit, padY = 20*unit;
    const boxW = tw + padX*2, boxH = 20*unit*1.7 + padY*1.2;

    ctx.save();
    ctx.globalAlpha = op;
    ctx.translate(cx,cy);
    ctx.scale(scale,scale);

    if (bubbleStyle === 'normal'){
      roundRectPath(ctx, -boxW/2,-boxH/2, boxW, boxH, 22*unit);
      ctx.fillStyle = textColor; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-boxW/2+36*unit, boxH/2);
      ctx.lineTo(-boxW/2+48*unit, boxH/2);
      ctx.lineTo(-boxW/2+36*unit, boxH/2+16*unit);
      ctx.closePath();
      ctx.fillStyle = textColor; ctx.fill();
      ctx.fillStyle = '#0B0C10';
    } else if (bubbleStyle === 'neon'){
      roundRectPath(ctx, -boxW/2,-boxH/2, boxW, boxH, 22*unit);
      ctx.shadowColor = accent; ctx.shadowBlur = 18*unit;
      ctx.strokeStyle = accent; ctx.lineWidth = 3*unit;
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.moveTo(-boxW/2+36*unit, boxH/2);
      ctx.lineTo(-boxW/2+48*unit, boxH/2);
      ctx.lineTo(-boxW/2+36*unit, boxH/2+16*unit);
      ctx.closePath();
      ctx.strokeStyle = accent; ctx.stroke();
      ctx.fillStyle = textColor;
    } else { // jagged
      ctx.fillStyle = accent;
      drawJaggedBlob(ctx, boxW*1.15, boxH*1.4);
      ctx.fillStyle = '#0B0C10';
    }

    ctx.fillText(text, 0, 0);
    ctx.restore();
  }

  recStartBtn.onclick = async () => {
    if (recordingActive) return;
    if (document.fonts && document.fonts.ready) await document.fonts.ready;

    const stageRect = document.querySelector('.stage').getBoundingClientRect();
    const SCALE = 3;
    const W = Math.round(stageRect.width * SCALE), H = Math.round(stageRect.height * SCALE);
    recCanvas.width = W; recCanvas.height = H;
    const ctx = recCanvas.getContext('2d');

    const videoStream = recCanvas.captureStream(30);
    let mimeType = 'video/webm;codecs=vp9';
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';
    try{
      mediaRecorder = new MediaRecorder(videoStream, { mimeType });
    }catch(e){
      alert('このブラウザは自動録画に対応していないみたい。デスクトップのChromeかEdgeで試してみて');
      return;
    }
    recChunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${mode}-rec-${Date.now()}.webm`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    };

    const LOOP_INTERVAL = mode === 'telop' ? 1300 : (mode === 'bubble' ? 1600 : 1800);
    const triggerTimes = [];
    for (let time = 100; time < recDurationMs; time += LOOP_INTERVAL){
      triggerTimes.push(time);
    }
    if (mode === 'pointer' && !pointerAnchor){
      pointerAnchor = { xPct:50, yPct:50 };
    }

    recordingActive = true;
    recStartBtn.disabled = true;
    recStatusRow.style.display = 'flex';
    recStatusText.textContent = '録画中...';

    const startTime = performance.now();
    function drawLoop(){
      if (!recordingActive) return;
      const elapsed = performance.now() - startTime;
      let activeTrigger = triggerTimes[0] || 0;
      for (const tm of triggerTimes){ if (tm <= elapsed) activeTrigger = tm; }
      const localT = elapsed - activeTrigger;

      ctx.clearRect(0,0,W,H);
      ctx.fillStyle = getBgFillColor();
      ctx.fillRect(0,0,W,H);

      if (mode === 'telop') drawTelopFrame(ctx, W, H, localT);
      else if (mode === 'pointer') drawPointerFrame(ctx, W, H, localT);
      else drawBubbleFrame(ctx, W, H, localT);

      recStatusText.textContent = `録画中... 残り ${Math.max(0, Math.ceil((recDurationMs-elapsed)/1000))}秒`;
      if (elapsed >= recDurationMs){
        stopRecording();
        return;
      }
      recRafId = requestAnimationFrame(drawLoop);
    }

    mediaRecorder.start();
    drawLoop();
  };

  function stopRecording(){
    if (!recordingActive) return;
    recordingActive = false;
    cancelAnimationFrame(recRafId);
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    recStatusText.textContent = '保存中...';
    setTimeout(() => { recStatusRow.style.display = 'none'; }, 1500);
    recStartBtn.disabled = false;
  }

  recCancelBtn.onclick = stopRecording;
</script>
</body>
</html>
